services:
  api:
    build:
      context: ../api
      dockerfile: ../docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=recipevault
      - DB_PASSWORD=recipevault
      - DB_NAME=recipevault
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-in-production}
      - PORT=8080
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ../app
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - VITE_API_URL=http://api:8080
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: recipevault
      POSTGRES_PASSWORD: recipevault
      POSTGRES_DB: recipevault
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../api/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipevault"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: