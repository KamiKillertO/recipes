<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RecipeVault</title>
</head>
<body>
  <main id="app"></main>
  <script type="module">
    import { html } from "lit";
    import { router } from "./lib/router";
    import { authStore } from "./lib/authStore";
    import { api } from "./lib/api";
    import "./views/login-lit.ts";
    import "./views/home-lit.ts";
    import "./views/import-lit.ts";
    import "./views/new-recipe-lit.ts";
    import "./views/recipe-detail-lit.ts";

    const isAuthed = () => authStore.isAuthenticated;

    authStore.restoreSession();

    api.setUnauthorizedHandler(() => {
      authStore.logout();
      router.navigate("/login", { replace: true });
    });

    router.init({
      outlet: document.getElementById("app"),
      routes: [
        {
          path: "/",
          title: "My Recipes",
          guard: isAuthed,
          render: () => html`<home-screen></home-screen>`,
        },
        {
          path: "/login",
          title: "Login",
          guard: () => !isAuthed(),
          redirectTo: "/",
          render: () => html`<login-screen></login-screen>`,
        },
        {
          path: "/import",
          title: "Scan Recipe",
          guard: isAuthed,
          render: () => html`<import-screen></import-screen>`,
        },
        {
          path: "/new-recipe",
          title: "New Recipe",
          guard: isAuthed,
          render: () => html`<new-recipe-screen></new-recipe-screen>`,
        },
        {
          path: "/recipe/:id",
          title: "Recipe Details",
          guard: isAuthed,
          render: (ctx) =>
            html`<recipe-detail-screen .recipeId=${ctx.params.id}></recipe-detail-screen>`,
        },
      ],
    });
  </script>
</body>
</html>
